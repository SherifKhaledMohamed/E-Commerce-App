<section>
    <app-section-header class="linear-green">
        <span class="section-name"><a routerLink="/categories"> Categories</a></span>
        <i class="fa-solid fa-layer-group text-4xl"></i>
        <h3 class="section-title">All Categories</h3>
        <p class="section-description">Browse our wide range of product categories</p>
    </app-section-header>

    <div class="container">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 my-10 gap-4">
            @for (category of allCategories(); track category._id) {
            <a routerLink="/categories/{{category.slug}}/{{category._id}}" class="group block max-w-[290px] rounded-3xl border border-gray-200 bg-white p-6 text-center
         shadow-md transition-all duration-300 ease-out
         hover:scale-105 hover:border-green-300 hover:shadow-xl">
                <!-- Image -->
                <div class="aspect-square overflow-hidden rounded-2xl bg-gray-100">
                    <img [src]="category.image" [alt]="category.name" class="h-full w-full object-cover object-top" />
                </div>

                <!-- Title -->
                <h3 class="mt-5 text-xl font-bold text-slate-900 transition-colors duration-300
           group-hover:text-green-600">
                    {{category.name}}
                </h3>

                <!-- Link: invisible by default, fades in on hover -->
                <span class="mt-2 inline-flex items-center gap-1 text-base text-green-600
           opacity-0 translate-y-1 transition-all duration-300
           group-hover:opacity-100 group-hover:translate-y-0">
                    View Category Details
                    <span aria-hidden="true">→</span>
                </span>
            </a>
            }
        </div>
    </div>
</section>
