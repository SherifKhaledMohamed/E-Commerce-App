<section>
    <app-section-header class="linear-purple">
        <span class="section-name"><a routerLink="/brands"> Brands</a></span>
        <i class="fa-solid fa-tags text-4xl"></i>
        <h3 class="section-title">Top Brands</h3>
        <p class="section-description">Shop from your favorite brands</p>
    </app-section-header>

    <div class="container">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 my-10 gap-4">
            @for (brand of allBrands(); track brand._id) {
            <a routerLink="/brands/{{brand.slug}}/{{brand._id}}" class="group block max-w-[290px] rounded-3xl border border-gray-200 bg-white p-6 text-center
         shadow-md transition-all duration-300 ease-out
         hover:scale-105 hover:border-green-300 hover:shadow-xl">
                <!-- Image -->
                <div class="aspect-square overflow-hidden rounded-2xl bg-transparent">
                    <img [src]="brand.image" [alt]="brand.name" class=" w-full object-cover object-top" />
                </div>

                <!-- Title -->
                <h3 class="mt-5 text-xl font-bold text-slate-900 transition-colors duration-300
           group-hover:text-green-600">
                    {{brand.name}}
                </h3>

                <!-- Link: invisible by default, fades in on hover -->
                <span class="mt-2 inline-flex items-center gap-1 text-base text-green-600
           opacity-0 translate-y-1 transition-all duration-300
           group-hover:opacity-100 group-hover:translate-y-0">
                    View Brand Details
                    <span aria-hidden="true">→</span>
                </span>
            </a>
            }
        </div>
    </div>
</section>
