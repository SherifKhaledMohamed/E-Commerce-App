<a routerLink="/shop/{{cardInput()._id}}" class="group flex h-48 flex-col justify-center rounded-2xl border border-gray-200 bg-white p-6
             shadow-sm transition-all duration-300 ease-out
             hover:-translate-y-1 hover:border-green-200 hover:shadow-xl hover:shadow-green-900/10
             focus-visible:-translate-y-1 focus-visible:border-green-300 focus-visible:outline-none
             focus-visible:ring-2 focus-visible:ring-green-400/50">
    <!-- Icon -->
    <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-green-50 text-2xl text-green-600
               transition-colors duration-300 group-hover:bg-green-100">
        <i class="fa-solid fa-folder-open"></i>
    </div>

    <!-- Title -->
    <h3 class="text-lg font-bold text-slate-900 transition-colors duration-300
               group-hover:text-green-600 group-focus-visible:text-green-600">
        {{ cardInput().name }}
    </h3>

    <!-- Hover-only action -->
    <div class="grid grid-rows-[0fr] opacity-0 transition-all duration-300
               group-hover:grid-rows-[1fr] group-hover:opacity-100
               group-focus-visible:grid-rows-[1fr] group-focus-visible:opacity-100
               [@media(hover:none)]:grid-rows-[1fr] [@media(hover:none)]:opacity-100">
        <div class="overflow-hidden">
            <span class="mt-2 inline-flex items-center gap-2 text-sm font-medium text-green-600">
                Browse Products
                <i
                    class="fa-solid fa-arrow-right text-xs transition-transform duration-300 group-hover:translate-x-1"></i>
            </span>
        </div>
    </div>
</a>
